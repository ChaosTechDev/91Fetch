services:
  91fetch:
    build: .
    container_name: 91fetch
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      TZ: Asia/Hong_Kong
      VIEWKEY_HOST: 0.0.0.0
      VIEWKEY_PORT: 8765
      VIEWKEY_DATA_DIR: /data
      VIEWKEY_DEFAULT_DOWNLOAD_DIR: /data/videos
      VIEWKEY_NO_BROWSER: "1"
      VIEWKEY_AUTH_ENABLED: "0"
    volumes:
      - ./data:/data
