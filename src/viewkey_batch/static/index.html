<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>91Fetch</title>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("viewkey-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
  <link rel="stylesheet" href="/static/styles.css?v=15">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="/static/app.js?v=15" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><i data-lucide="clapperboard"></i></span>
      <div><strong>91Fetch</strong><span>视频采集与批量下载</span></div>
    </div>
    <div class="topbar-actions">
      <div class="server-status"><span class="status-dot"></span><span id="siteHost">本地服务</span></div>
      <button class="icon-button theme-toggle" id="themeToggle" title="切换日间/夜间主题">
        <i class="theme-sun" data-lucide="sun"></i><i class="theme-moon" data-lucide="moon"></i>
      </button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="section-label">工作区</div>
      <nav class="side-nav">
        <button class="side-nav-item active" data-view="catalog"><i data-lucide="layout-grid"></i><span>视频目录</span><b id="catalogBadge">0</b></button>
        <button class="side-nav-item" data-view="downloads"><i data-lucide="list"></i><span>下载管理</span><b id="activeDownloadBadge" class="hidden">0</b></button>
        <button class="side-nav-item" data-view="settings"><i data-lucide="settings-2"></i><span>设置中心</span></button>
      </nav>

      <div class="sidebar-divider"></div>
      <div class="section-label">视频分类</div>
      <div class="category-list">
        <button type="button" class="category-item active" data-category="latest"><i data-lucide="clock-3"></i><span>最新发布</span></button>
        <button type="button" class="category-item" data-category="hot"><i data-lucide="flame"></i><span>当前最热</span></button>
        <button type="button" class="category-item" data-category="featured"><i data-lucide="badge-check"></i><span>加精推荐</span></button>
        <button type="button" class="category-item" data-category="top_day"><i data-lucide="medal"></i><span>每日排行</span></button>
        <button type="button" class="category-item" data-category="top_month"><i data-lucide="trophy"></i><span>本月最热</span></button>
        <button type="button" class="category-item" data-category="most_favorited"><i data-lucide="heart"></i><span>最多收藏</span></button>
        <button type="button" class="category-item" data-category="most_discussed"><i data-lucide="messages-square"></i><span>最多讨论</span></button>
        <button type="button" class="category-item" data-category="hd"><i data-lucide="circle-play"></i><span>高清视频</span></button>
        <button type="button" class="category-item" data-category="original"><i data-lucide="sparkles"></i><span>原创视频</span></button>
      </div>

      <div class="sidebar-divider"></div>
      <div class="section-label">任务状态</div>
      <div id="jobPanel" class="job-panel empty">
        <div class="job-icon"><i data-lucide="activity"></i></div>
        <div><strong id="jobTitle">暂无运行任务</strong><span id="jobMessage">采集或下载任务会显示在这里</span></div>
        <div class="progress-track"><span id="jobProgress"></span></div>
      </div>
    </aside>

    <main class="content">
      <div class="content-header">
        <div>
          <h1 id="viewTitle">视频目录</h1>
          <p id="viewSubtitle"><span id="resultCount">0</span> 个采集结果</p>
        </div>
        <div class="header-actions">
          <div class="search-box" id="searchBox">
            <i data-lucide="search"></i>
            <input id="searchInput" placeholder="搜索标题、作者或 viewkey">
          </div>
          <button class="icon-button" id="refreshButton" title="刷新目录"><i data-lucide="refresh-cw"></i></button>
        </div>
      </div>

      <div id="catalogView">
        <div class="selection-bar" id="selectionBar">
          <label class="check-control"><input type="checkbox" id="selectAll"><span></span>全选当前结果</label>
          <div class="selection-count">已选择 <strong id="selectedCount">0</strong> 项</div>
          <button class="ghost-button danger" id="removeButton" disabled><i data-lucide="trash-2"></i><span>移出目录</span></button>
          <button class="download-button" id="downloadButton" disabled><i data-lucide="download"></i><span>下载所选</span></button>
        </div>

        <div id="emptyState" class="empty-state">
          <div class="empty-visual"><i data-lucide="gallery-horizontal-end"></i></div>
          <h2>还没有采集结果</h2>
          <p>从左侧选择分类，这里会实时显示该页的视频。</p>
        </div>
        <div id="videoGrid" class="video-grid hidden"></div>
        <nav class="pagination" id="pagination" aria-label="视频分页">
          <button class="ghost-button" id="previousPage"><i data-lucide="chevron-left"></i><span>上一页</span></button>
          <form id="pageJumpForm" class="page-jump">
            <label for="pageNumber">第</label>
            <input id="pageNumber" type="number" min="1" max="10000" value="1">
            <span>页</span>
            <button class="ghost-button" type="submit">跳转</button>
          </form>
          <button class="ghost-button" id="nextPage"><span>下一页</span><i data-lucide="chevron-right"></i></button>
        </nav>
      </div>

      <div id="downloadsView" class="hidden">
        <div class="download-summary">
          <div><span>正在下载</span><strong id="downloadingCount">0</strong></div>
          <div><span>等待中</span><strong id="queuedCount">0</strong></div>
          <div><span>已完成</span><strong id="completedCount">0</strong></div>
          <div><span>失败</span><strong id="failedCount">0</strong></div>
          <div class="disk-usage"><span>已占空间</span><strong id="totalDiskUsage">0 B</strong></div>
        </div>
        <div class="download-selection-bar">
          <label class="check-control"><input type="checkbox" id="selectAllDownloads"><span></span>全选任务</label>
          <div class="selection-count">已选择 <strong id="selectedDownloadCount">0</strong> 项</div>
          <div class="download-filter-group" role="group" aria-label="任务筛选">
            <button class="download-filter active" type="button" data-filter="all">全部</button>
            <button class="download-filter" type="button" data-filter="pending">未完成</button>
            <button class="download-filter" type="button" data-filter="completed">已完成</button>
          </div>
          <button class="ghost-button" id="downloadMissingButton"><i data-lucide="list-restart"></i><span>下载全部未完成</span></button>
          <button class="ghost-button" id="retryAllButton" disabled><i data-lucide="rotate-ccw"></i><span>重试失败</span></button>
          <button class="ghost-button" id="downloadSelectedButton" disabled><i data-lucide="download"></i><span>下载所选</span></button>
          <button class="ghost-button danger" id="removeDownloadsButton" disabled title="移除任务，不删除本地视频文件"><i data-lucide="trash-2"></i><span>删除任务</span></button>
        </div>
        <div class="download-list-header"><span>视频</span><span>文件</span><span>状态</span><span>操作</span></div>
        <div id="downloadList" class="download-list"></div>
        <div id="downloadEmpty" class="empty-state compact">
          <div class="empty-visual"><i data-lucide="inbox"></i></div>
          <h2>还没有下载任务</h2>
          <p>在视频目录中勾选内容，然后点击“下载所选”。</p>
        </div>
      </div>

      <div id="settingsView" class="hidden">
        <form id="settingsForm" class="settings-form">
          <section class="settings-section">
            <div class="settings-section-heading"><div><h2>存储与下载</h2><p>下载目录、归档方式和并发参数会保存在本机。</p></div></div>
            <div class="settings-grid storage-settings-grid">
              <label class="settings-field settings-wide" for="settingDownloadDir"><span>下载目录</span><input id="settingDownloadDir" placeholder="例如 downloads/videos"></label>
              <label class="settings-field" for="settingFolderMode"><span>归档方式</span><select id="settingFolderMode"><option value="flat">直接保存到目录</option><option value="date">按日期建文件夹</option><option value="category">按分类建文件夹</option><option value="date_category">按日期和分类</option></select></label>
              <label class="settings-field" for="settingWorkers"><span>并行任务数</span><input id="settingWorkers" type="number" min="1" max="8"></label>
              <label class="settings-field" for="settingFragments"><span>单任务分片数</span><input id="settingFragments" type="number" min="1" max="16"></label>
            </div>
          </section>

          <section class="settings-section">
            <div class="settings-section-heading"><div><h2>界面刷新</h2><p>下载管理自动读取最新进度的频率。</p></div></div>
            <div class="settings-grid"><label class="settings-field" for="settingUiRefresh"><span>刷新间隔秒数</span><input id="settingUiRefresh" type="number" min="1" max="60"></label></div>
          </section>

          <div class="settings-actions"><button class="primary-button" type="submit"><i data-lucide="save"></i><span>保存设置</span></button><span id="settingsSaveMessage"></span></div>
        </form>
      </div>
    </main>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
</body>
</html>
