[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "91fetch"
version = "1.0.0"
description = "Web UI for browsing, selecting, and downloading viewkey videos"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx[brotli,http2]>=0.27.2",
  "typer>=0.12.5",
  "rich>=13.8.1",
  "yt-dlp>=2025.1.15",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3.3", "respx>=0.21.1"]

[project.scripts]
91fetch = "viewkey_batch.cli:app"
91fetch-web = "viewkey_batch.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/viewkey_batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
